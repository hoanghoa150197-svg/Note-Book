const KEY='book-quotes-library-v1';let books=[],current=null,search='',sort='page',editing=null;const sample=[['Bạn không thích trò chuyện ư? Có lẽ bạn sợ nói những điều không đúng, hay bạn có ý tưởng đúng nhưng lại sợ diễn đạt sai',null],['Nếu bạn tới chơi nhà ai đó thì hãy quan sát những vật trưng bày, những đồ kỷ niệm, sau đó thì... Alê, cười tươi như hoa với chủ nhà, và bắt đầu câu chuyện. Tôi chắc chắn rằng người ta sẽ vui vẻ khi nói về nó. Giả dụ như trên tường có treo một tấm hình chụp gia chủ đang đứng ở Quảng Trường Đỏ chẳng hạn, hãy hỏi về chuyến đi Nga của họ. Hãy hỏi thử xem lẵng hoa ai cắm mà đẹp thế... Những đồ vật tuy vô tri vô giác song rất có ý nghĩa với cuộc trò chuyện của bạn',25],['Thế mới biết trong buôn bán thì cách nói khôn khéo có ý nghĩa rất quan trọng. Bạn phải biết nhấn mạnh ưu điểm của món hàng sao cho thuyết phục. Đừng giải thích hoạt động của con chíp điện tử trong cái lò nướng bánh hiện đại như thế nào. Thay vào đó hãy nói về việc khách hàng sẽ được dùng bữa sáng với một tách cà phê đang bốc khói và một chiếc bánh xốp nướng vàng. Đừng hào hứng nói về món tiền đền bù nếu món hàng bị trục trặc mà hãy nói đến uy tín của công ty. Cách nói ôn tồn hòa nhã sẽ tạo độ tin cậy hơn là sự bộp chộp nhanh nhẩu',70],['Bạn có thể làm được những điều gì độc đáo? Khoan hỏi công ty sẽ đem lại những gì cho bạn, mà hãy nói những gì bạn có thể làm được cho công ty. Đừng kể dài dòng về tiểu sử của bạn, bởi họ đã biết những cái ấy trong hồ sơ mà họ vừa mới đọc. Thay vào đó hãy trình bày bạn có thể làm tốt công việc hơn những người khác như thế nào. Nói cách khác, bạn nên trình bày cụ thể những ưu điểm của mình thay vì cứ đắp vào khoảng thời gian phỏng vấn ngắn ngủi bằng bản tường trình lý lịch. Hãy nói về kiến thức, kỹ năng, kinh nghiệm của bạn. Bạn có những ý tưởng độc đáo về lãnh vực này hay không? Khả năng chuyên môn của bạn như thế nào? Ngoài ra, bạn còn có những mối quan tâm gì về lĩnh vực này',71],['Có một quy tắc hết sức đơn giản là: Hãy nói chuyện với những người dưới quyền theo cái cách mà bạn muốn ông chủ nói chuyện với mình.',76],['Hãy viết ra giấy bài nói, chi tiết từng từ một hay sơ lược tùy vào thói quen của bạn, nhưng phải rõ ràng và đủ ý. Cái chính là nó sẽ giúp bạn nói một cách tự tin và hiệu quả. Tiếp theo, tưởng tượng rằng bạn đang đứng trước khán giả và bắt đầu nói. Luyện tập bài nói nhiều lần cho tới lúc bạn có thể nhìn khán giả mà thao thao bất tuyệt. Đừng bao giờ quá phụ thuộc vào tờ giấy đến mức không ngoái nhìn khán giả. Hãy nhớ rằng người ta đến đó để nghe bạn nói, không phải để nghe bạn đọc.',108],['Đừng quên ghi âm giọng nói của chính mình. Tôi biết lần đầu tiên khi nghe đoạn băng đó chắc chắn bạn sẽ thốt lên rằng: "Ôi trời! Nghe khủng khiếp quá!". Nhưng nhờ nó bạn sẽ biết mình cần chấn chỉnh chỗ nào, sửa giọng ra sao. Bạn nói có nhanh quá không, hoặc có tẻ nhạt không, phong cách nói riêng của bạn như thế nào... Khách quan hơn cả là hãy nhờ người thân góp ý',130]];
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}function save(){try{localStorage.setItem(KEY,JSON.stringify(books));return true}catch(e){alert('Không đủ bộ nhớ trình duyệt để lưu ảnh. Hãy giảm số lượng/kích thước ảnh hoặc xuất JSON để sao lưu.');return false}}try{const v=JSON.parse(localStorage.getItem(KEY));books=Array.isArray(v)?v:[]}catch{}if(!books.length&&!localStorage.getItem(KEY)){books=[{id:uid(),name:'Sách về nghệ thuật giao tiếp',author:'Sách mẫu · Bạn có thể đổi tên',quotes:sample.map(([text,page])=>({id:uid(),text,page,created:Date.now()}))}];save()}function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function toast(t){let n=document.getElementById('toast');n.textContent=t;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),2200)}function activeBook(){return books.find(b=>b.id===current)}function render(){let shelf=document.getElementById('shelf');shelf.replaceChildren();let all=el('button',!current?'active':'','⌂  Tất cả sách');all.onclick=()=>{current=null;search='';render()};shelf.append(all);books.forEach(b=>{let n=el('button',current===b.id?'active':'','▤  '+b.name);n.onclick=()=>{current=b.id;search='';render()};shelf.append(n)});let c=document.getElementById('content');c.replaceChildren();let b=activeBook();if(!b){let h=el('div','top');let left=el('div');left.append(el('div','eyebrow','THƯ VIỆN CỦA BẠN'),el('h1','','Những trang sách đáng nhớ'),el('div','muted',books.length+' cuốn sách · '+books.reduce((n,b)=>n+b.quotes.length,0)+' trích dẫn'));h.append(left);c.append(h);let tb=el('div','toolbar');let inp=el('input');inp.placeholder='Tìm tên sách hoặc tác giả...';inp.value=search;inp.oninput=()=>{search=inp.value;render();};tb.append(inp);c.append(tb);let g=el('div','grid');books.filter(b=>(b.name+' '+b.author).toLowerCase().includes(search.toLowerCase())).forEach(b=>{let card=el('article','book');card.append(el('div','cover','❝'));let info=el('div');info.append(el('h2','',b.name),el('div','muted',b.author||'Chưa có tác giả'),el('div','muted',b.quotes.length+' câu trích dẫn'));card.append(info);card.onclick=()=>{current=b.id;search='';render()};g.append(card)});c.append(g.children.length?g:el('div','empty','Chưa có sách phù hợp. Hãy tạo một cuốn sách mới.'));return}let back=el('button','back','← Thư viện');back.onclick=()=>{current=null;search='';render()};c.append(back);let h=el('div','top');let l=el('div');l.append(el('div','eyebrow','TRÍCH DẪN TỪ SÁCH'),el('h1','',b.name),el('div','muted',(b.author||'Chưa có tác giả')+' · '+b.quotes.length+' câu trích dẫn'));h.append(l);let tools=el('div','toolbar');[['＋ Thêm trích dẫn',()=>openQuoteModal()],['Dán nhiều câu',()=>openBulkModal()],['Sửa sách',()=>openBookModal(b)],['Xuất dữ liệu',exportData]].forEach(([t,fn],i)=>{let n=el('button','btn'+(i===0?' primary':''),t);n.onclick=fn;tools.append(n)});h.append(tools);c.append(h);let tb=el('div','toolbar');let inp=el('input');inp.placeholder='Tìm nội dung, mục lớn hoặc số trang...';inp.value=search;inp.oninput=()=>{search=inp.value;drawQuotes()};let sel=el('select');[['page','Trang tăng dần'],['new','Mới nhất'],['old','Cũ nhất'],['page-desc','Trang giảm dần']].forEach(([v,t])=>{let o=el('option','',t);o.value=v;sel.append(o)});sel.value=sort;sel.onchange=()=>{sort=sel.value;drawQuotes()};tb.append(inp,sel);c.append(tb);let q=el('div');q.id='quoteArea';c.append(q);drawQuotes()}
function drawQuotes(){let b=activeBook();if(!b)return;let area=document.getElementById('quoteArea');area.replaceChildren();let arr=b.quotes.filter(q=>(q.text+' '+(q.category||'')+' '+(q.page??'')).toLowerCase().includes(search.toLowerCase()));arr.sort((a,b)=>sort==='new'?b.created-a.created:sort==='old'?a.created-b.created:sort==='page-desc'?(b.page??-1)-(a.page??-1):(a.page??Infinity)-(b.page??Infinity));let grid=el('div','quotes');arr.forEach(q=>{let card=el('article','quote');let para=el('p','quote-text collapsed',q.text);card.append(el('div','mark','“'));if(q.category)card.append(el('div','category','▤ '+q.category.split('/').map(x=>x.trim()).filter(Boolean).join('  ›  ')));card.append(para);if(Array.isArray(q.images)&&q.images.length){let photos=el('div','photos');q.images.forEach(src=>{let im=el('img');im.src=src;im.alt='Ảnh đính kèm trích dẫn';im.loading='lazy';im.onclick=()=>showImage(src);photos.append(im)});card.append(photos)}let toggle=el('button','toggle hidden','Xem thêm');toggle.type='button';toggle.setAttribute('aria-expanded','false');toggle.onclick=()=>{let expanded=para.classList.toggle('collapsed')===false;toggle.textContent=expanded?'Ẩn bớt':'Xem thêm';toggle.setAttribute('aria-expanded',String(expanded))};card.append(toggle);requestAnimationFrame(()=>{if(para.scrollHeight>para.clientHeight+2)toggle.classList.remove('hidden')});let foot=el('footer');foot.append(el('span','page',q.page!=null?'◷ Trang '+q.page:'Chưa ghi số trang'));let acts=el('div','actions');[['Sao chép','⧉',()=>navigator.clipboard.writeText((q.category?q.category+'\n':'')+q.text+(q.page!=null?' /'+q.page+'/':'')).then(()=>toast('Đã sao chép'))],['Chỉnh sửa','✎',()=>openQuoteModal(q)],['Xóa','×',()=>{if(confirm('Xóa trích dẫn này?')){b.quotes=b.quotes.filter(x=>x.id!==q.id);save();render()}}]].forEach(([t,s,fn])=>{let btn=el('button','small',s);btn.title=t;btn.onclick=fn;acts.append(btn)});foot.append(acts);card.append(foot);grid.append(card)});area.append(arr.length?grid:el('di function modal(title){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').replaceChildren();document.getElementById('modal').classList.remove('hidden');return document.getElementById('modalBody')}function closeModal(){document.getElementById('modal').classList.add('hidden')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function field(parent,label,tag='input',value=''){let wrap=el('div','form');wrap.append(el('label','',label));let f=el(tag,'field');f.value=value;wrap.append(f);parent.append(wrap);return f}function dialogButtons(root,submit){let row=el('div','dialog-actions');let cancel=el('button','btn','Hủy');cancel.onclick=closeModal;let ok=el('button','btn primary','Lưu');ok.onclick=submit;row.append(cancel,ok);root.append(row)}function openBookModal(b){let root=modal(b?'Sửa thông tin sách':'Thêm cuốn sách');let name=field(root,'Tên cuốn sách','input',b?.name||'');let author=field(root,'Tác giả (không bắt buộc)','input',b?.author||'');dialogButtons(root,()=>{if(!name.value.trim())return alert('Nhập tên sách');if(b){b.name=name.value.trim();b.author=author.value.trim()}else{let n={id:uid(),name:name.value.trim(),author:author.value.trim(),quotes:[]};books.push(n);current=n.id}save();closeModal();render()});if(b){let del=el('button','btn','Xóa cuốn sách');del.style.marginTop='15px';del.onclick=()=>{if(confirm('Xóa sách và tất cả trích dẫn trong sách?')){books=books.filter(x=>x.id!==b.id);current=null;save();closeModal();render()}};root.append(del)}}function parseQuote(raw){let text=raw.trim().replace(/^\s*[-–•]\s*/,'').replace(/\s+/g,' ');let m=text.match(/\s*\/\s*(\d+)\s*\/\s*$/);return {text:m?text.slice(0,m.index).trim():text,page:m?Number(m[1]):null}}function showImage(src){let ov=el('div','lightbox');let im=el('img');im.src=src;ov.append(im);ov.onclick=()=>ov.remove();document.body.append(ov)}
function imageToDataUrl(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('Tệp không phải ảnh'));let reader=new FileReader();reader.onerror=()=>reject(Error('Không đọc được ảnh'));reader.onload=()=>{let im=new Image();im.onerror=()=>reject(Error('Ảnh không hợp lệ'));im.onload=()=>{let scale=Math.min(1,1400/Math.max(im.width,im.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};im.src=reader.result};reader.readAsDataURL(file)})}
function openQuoteModal(q){let root=modal(q?'Sửa trích dẫn':'Thêm trích dẫn');let content=field(root,'Nội dung trích dẫn','textarea',q?.text||'');let category=field(root,'Mục lớn / Phân cấp (dùng dấu / để ngăn các cấp)','input',q?.category||'');category.placeholder='II. Các câu nói hay/1. Nói về đời sống/a. Đời sống nông thôn';let page=field(root,'Trang sách (có thể để trống)','input',q?.page??'');page.type='number';page.min=1;root.append(el('p','hint','Bạn cũng có thể nhập /70/ ở cuối câu; hệ thống sẽ tự nhận diện trang sách.'));
let photos=[...(q?.images||[])];let zone=el('div','photo-input');zone.tabIndex=0;zone.append(el('div','','Ảnh trích dẫn — dán ảnh bằng Ctrl+V, hoặc chọn ảnh từ thiết bị.'));let picker=el('input');picker.type='file';picker.accept='image/*';picker.multiple=true;picker.style.marginTop='9px';zone.append(picker);let thumbnails=el('div','photo-list');thumbnails.style.marginTop='10px';root.append(zone,thumbnails);function thumbnailsDraw(){thumbnails.replaceChildren();photos.forEach((src,i)=>{let item=el('div','photo-item');let im=el('img');im.src=src;im.onclick=()=>showImage(src);let del=el('button','','×');del.title='Xóa ảnh';del.onclick=()=>{photos.splice(i,1);thumbnailsDraw()};item.append(im,del);thumbnails.append(item)})}thumbnailsDraw();async function addFiles(files){for(const file of files){if(!file.type.startsWith('image/'))continue;try{photos.push(await imageToDataUrl(file))}catch(e){alert(e.message)}}thumbnailsDraw()}picker.onchange=()=>{addFiles([...picker.files]);picker.value=''};zone.onpaste=e=>{let files=[...e.clipboardData.items].filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();addFiles(files)}};content.onpaste=e=>{let files=[...e.clipboardData.items].filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();addFiles(files)}};
dialogButtons(root,()=>{let parsed=parseQuote(content.value);if(!parsed.text&&!photos.length)return alert('Nhập nội dung hoặc thêm ảnh');let p=page.value.trim()?Number(page.value):parsed.page;if(p!==null&&(!Number.isInteger(p)||p<1))return alert('Số trang phải là số nguyên dương');let b=activeBook();let categoryValue=category.value.trim().split('/').map(v=>v.trim()).filter(Boolean).join('/');if(q){q.text=parsed.text;q.page=p;q.category=categoryValue;q.images=photos}else b.quotes.push({id:uid(),text:parsed.text,page:p,category:categoryValue,images:photos,created:Date.now()});save();closeModal();render()})}
function openBulkModal(){let root=modal('Dán nhiều trích dẫn');let category=field(root,'Mục lớn áp dụng cho tất cả câu (không bắt buộc)','input');category.placeholder='II. Các câu nói hay/1. Nói về đời sống/a. Đời sống nông thôn';let ta=field(root,'Dán danh sách các câu (mỗi câu bắt đầu bằng dấu -)','textarea');ta.style.minHeight='240px';root.append(el('p','hint','Ví dụ: - Một câu hay /25/\n- Một câu khác /70/\nCó thể xuống dòng trong cùng một trích dẫn. Số ở cuối dạng /25/ sẽ được hiểu là trang 25.'));dialogButtons(root,()=>{let raw=ta.value.trim();if(!raw)return alert('Hãy dán nội dung');let chunks=raw.split(/(?:^|\n)\s*[-–•]\s+/).map(s=>s.trim()).filter(Boolean);if(!chunks.length)chunks=[raw];let qs=chunks.map(parseQuote).filter(x=>x.text);if(!qs.length)return alert('Không tìm thấy trích dẫn');activeBook().quotes.push(...qs.map(q=>({...q,id:uid(),category:category.value.trim(),images:[],created:Date.now()+Math.random()})));save();closeModal();render();toast('Đã thêm '+qs.length+' trích dẫn')})}function exportData(){let b=activeBook();let blob=new Blob([JSON.stringify(b||books,null,2)],{type:'application/json'});download(blob,'trich-dan-sach.json')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function addImport(){let btn=el('button','','⇩ Nhập dữ liệu JSON');btn.onclick=()=>{let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let v=JSON.parse(await f.files[0].text());let incoming=Array.isArray(v)?v:[v];if(!incoming.every(x=>x.name&&Array.isArray(x.quotes)))throw Error('Dữ liệu không đúng định dạng');if(!confirm('Nhập '+incoming.length+' cuốn sách? Dữ liệu cũ sẽ được giữ lại.'))return;incoming.forEach(x=>books.push({...x,id:uid(),quotes:x.quotes.map(q=>({...q,id:uid()}))}));save();render();toast('Đã nhập dữ liệu')}catch(e){alert('Không thể nhập: '+e.message)}};f.click()};document.querySelector('.sidebar').append(btn)}addImport();render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller){const ok=confirm('Đã có phiên bản Sổ tay đọc sách mới. Tải lại để cập nhật?');if(ok)window.location.reload()}})})}).catch(err=>console.warn('Service worker:',err))})}</script></body></html>
